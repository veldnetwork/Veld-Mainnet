# Public, read-only projections for the existing hosted wallet RPC service.
# Include inside the Explorer server block. Client request bodies are ignored.
location = /api/v1/transaction {
    if ($arg_height !~ "^[0-9]{1,10}$") { return 400; }
    if ($arg_txid !~ "^[a-f0-9]{64}$") { return 400; }
    limit_req zone=wallet_rpc burst=20 nodelay;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8090/rpc;
    proxy_method POST;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Host wallet.veld.network;
    proxy_set_header Content-Type application/json;
    proxy_set_header Accept-Encoding "";
    proxy_set_body '{"jsonrpc":"2.0","id":"explorer-details","method":"gettransaction","params":["$arg_txid","$arg_height"]}';
    proxy_read_timeout 12s;
    proxy_buffering on;
    proxy_max_temp_file_size 0;
    include /etc/nginx/snippets/veld-proxy-security-hide.conf;
    include /etc/nginx/snippets/veld-security-headers.conf;
    add_header Cache-Control "no-store" always;
}
location = /api/v1/transaction-history {
    if ($arg_address !~ "^V[1-9A-HJ-NP-Za-km-z]{25,40}$") { return 400; }
    limit_req zone=wallet_rpc burst=20 nodelay;
    if ($arg_cursor !~ "^(|ah1:r:[a-f0-9]{50}:[0-9]{20}:[0-9]{10}:[a-f0-9]{64})$") { return 400; }
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8090/rpc;
    proxy_method POST;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Host wallet.veld.network;
    proxy_set_header Content-Type application/json;
    proxy_set_header Accept-Encoding "";
    proxy_set_body '{"jsonrpc":"2.0","id":"explorer-history","method":"getaddresshistory","params":["$arg_address","50","$arg_cursor"]}';
    proxy_read_timeout 12s;
    proxy_buffering on;
    proxy_max_temp_file_size 0;
    include /etc/nginx/snippets/veld-proxy-security-hide.conf;
    include /etc/nginx/snippets/veld-security-headers.conf;
    add_header Cache-Control "no-store" always;
}
