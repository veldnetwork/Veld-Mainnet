sub_filter "During the subsidy era, transaction fees flow to the vault on top of its block share. When effective subsidy is zero, fee routing is 50% miner, 40% vault, and 10% validator pool, subject to integer rounding. The fee-only allocation applies at every height, including every 100th block. Exact permitted subsidy plus authenticated fees remain mandatory." "During the subsidy era, transaction fees flow to the vault on top of its block share. When effective subsidy is zero, fee routing is 50% miner, 40% vault, and 10% validator pool, subject to integer rounding. The fee-only allocation applies at every height, including every 100th block. Exact permitted subsidy plus authenticated fees remain mandatory. From block 34,750, 100% of native transaction fees go to the block miner permanently, including every 100th block and the fee-only era. Exchange trading fees are separate.";
sub_filter "The next distribution budget is limited to 90% of the previous cycle's vault inflow and 8% of spendable vault funds, whichever is lower. Recipient limits, transaction costs and integer rounding also apply." "The next distribution budget is limited to 90% of the previous cycle's vault inflow and 8% of spendable vault funds, whichever is lower. Recipient limits, transaction costs and integer rounding also apply. From block 34,750, surplus above a 20,000 VELD reserve target can increase the budget within the 8% cycle limit. The target is not a locked balance or a maximum.";
