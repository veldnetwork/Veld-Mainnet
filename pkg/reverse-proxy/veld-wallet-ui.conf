sub_filter 'html:not([data-theme="light"]) .wallet-bal-hero .balance-amount>span{color:#7ED949!important;-webkit-text-fill-color:#7ED949!important;font-size:14px!important;text-shadow:none!important;letter-spacing:0!important}' 'html:not([data-theme="light"]) .wallet-bal-hero .balance-amount>span{color:#7ED949!important;-webkit-text-fill-color:#7ED949!important;text-shadow:none!important}';
