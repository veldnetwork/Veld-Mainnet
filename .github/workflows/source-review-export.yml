name: Source review export

on:
  pull_request:
    paths:
      - '.github/workflows/source-review-export.yml'

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'cleanup/v3.2.7-source-readability-20260924'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cdceef25ccc5612855d89e784e8f9fd09a6e755d
          persist-credentials: false
      - name: Archive tracked release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = cdceef25ccc5612855d89e784e8f9fd09a6e755d
          test "$(git rev-parse HEAD^{tree})" = 8147916a46d8370b89bda680963acc8b0572a17d
          mkdir "$RUNNER_TEMP/source-review"
          git archive --format=tar.gz --prefix=veld-3.2.7/ HEAD > "$RUNNER_TEMP/source-review/source.tar.gz"
          git ls-tree -r --full-tree HEAD > "$RUNNER_TEMP/source-review/git-tree.txt"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source-review/identity.txt"
          python -m pip download --only-binary=:all: --no-deps --dest "$RUNNER_TEMP/source-review/tools" clang-format==18.1.8 ruff==0.11.13
          cd "$RUNNER_TEMP/source-review"
          sha256sum source.tar.gz git-tree.txt identity.txt tools/* > SHA256SUMS.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: veld-3.2.7-review-source
          path: ${{ runner.temp }}/source-review/
          if-no-files-found: error
          retention-days: 1
