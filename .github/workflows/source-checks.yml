name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Source and web checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install test dependencies
        run: |
          python -m pip install --only-binary=:all: -r tests/requirements.txt
      - name: Run portable checks
        run: python tests/run_checks.py
      - name: Compile and run work-admission tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++20 -O1 -pthread -Iinclude tests/work_admission_tests.cpp -o "$RUNNER_TEMP/work_admission_tests"
          "$RUNNER_TEMP/work_admission_tests"
      - name: Compile and run mining nonce tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++20 -O1 -pthread -Iinclude tests/mining_nonce_tests.cpp -o "$RUNNER_TEMP/mining_nonce_tests"
          "$RUNNER_TEMP/mining_nonce_tests"
      - name: Verify mining primitives and concurrent work headers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for test in mining_primitive_tests mining_work_header_tests mining_hash_vectors; do
            c++ -std=c++20 -O2 -pthread -DVELD_MAINNET_POW -DVELD_PUBLIC_RELEASE -DVELD_PUBLIC_MAINNET \
              -Iinclude "tests/$test.cpp" -o "$RUNNER_TEMP/$test"
            if [[ $test == mining_hash_vectors ]]; then
              "$RUNNER_TEMP/$test" tests/fixtures/veldhash-3.0.9-vectors.txt
            else
              "$RUNNER_TEMP/$test"
            fi
          done
      - name: Verify active mining search accounting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          objects=()
          index=0
          while IFS= read -r source; do
            [[ -n $source && $source != \#* ]] || continue
            object="$RUNNER_TEMP/mining-pqc-$index.o"
            cc -std=c11 -O2 -Ivendor/pqc -Ivendor/pqc/mldsa65 -c "$source" -o "$object"
            objects+=("$object")
            index=$((index + 1))
          done < vendor/pqc/provenance/release-c-sources.txt
          for test in mining_search_tests mining_solution_tests; do
            c++ -std=c++20 -O2 -pthread -Iinclude -Ivendor/pqc "tests/$test.cpp" "${objects[@]}" \
              -o "$RUNNER_TEMP/$test"
            "$RUNNER_TEMP/$test"
          done
