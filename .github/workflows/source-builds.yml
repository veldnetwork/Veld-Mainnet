name: Source build and service checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services:
    name: Pool and custody unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --only-binary=:all: -r tests/requirements.txt
      - name: Exercise service and permission fixtures
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          mkdir "$RUNNER_TEMP/service-results"
          python -m unittest discover -s pool -t . -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/service-results/pool.log"
          python -m unittest discover -s swap -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/service-results/custody.log"
          (umask 077; python -m unittest pool.test_journal_files -v) 2>&1 | tee "$RUNNER_TEMP/service-results/private-permissions.log"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: service-test-results
          path: ${{ runner.temp }}/service-results/
          retention-days: 7
          if-no-files-found: warn

  linux-builds:
    name: Unsigned Linux build (${{ matrix.role }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        role: [node, desktop, pool-worker, keygen, validator, operator, fleet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libleveldb-dev libssl-dev
          python -m pip install --only-binary=:all: -r tests/requirements.txt
      - name: Build the documented production profile without signing or deployment
        shell: bash
        run: |
          set -euo pipefail
          bash build/mainnet-v2-linux.sh '${{ matrix.role }}' "$RUNNER_TEMP/source-build"
      - name: Exercise the Linux pool command in a disposable TLS fixture
        if: matrix.role == 'pool-worker'
        run: |
          python3 tests/linux_pool_client_cli_tests.py "$RUNNER_TEMP/source-build/bin/veld-pool-client"
      - name: Verify portable identity recovery and the interactive pool entry
        if: matrix.role == 'node'
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O0 -pthread -ffunction-sections -fdata-sections \
            -DVELD_MAINNET_POW -DVELD_PUBLIC_RELEASE -DVELD_PUBLIC_MAINNET \
            -DVELD_USE_LEVELDB -DVELD_ENABLE_SNAPSHOT_BOOTSTRAP \
            -Iinclude -Ivendor/pqc -Ivendor/pqc/mldsa65 \
            tests/portable_keyfile_identity_tests.cpp "$RUNNER_TEMP/source-build/obj/"*.o \
            -Wl,--gc-sections -lssl -lcrypto -lleveldb -o "$RUNNER_TEMP/keyfile-tests"
          "$RUNNER_TEMP/keyfile-tests" "$RUNNER_TEMP/keyfile-identity-state"
          sudo unshare --net -- bash -c 'ip link set lo up; exec python3 "$@"' \
            bash tests/linux_keyfile_resume_tests.py "$RUNNER_TEMP/source-build/bin/veld-node"
          bash build/mainnet-v2-linux.sh pool-worker "$RUNNER_TEMP/menu-worker-build"
          cp "$RUNNER_TEMP/menu-worker-build/bin/veld-pool-client" "$RUNNER_TEMP/source-build/bin/"
          sudo unshare --net -- bash -c 'ip link set lo up; exec python3 "$@"' \
            bash tests/linux_pool_menu_tests.py "$RUNNER_TEMP/source-build/bin/veld-node"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: success() && contains(fromJSON('["node", "desktop", "pool-worker"]'), matrix.role)
        with:
          name: unsigned-linux-${{ matrix.role }}-payload
          path: |
            ${{ runner.temp }}/source-build/
            !${{ runner.temp }}/source-build/obj/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: linux-${{ matrix.role }}-build-evidence
          path: ${{ runner.temp }}/source-build/logs/
          retention-days: 7
          if-no-files-found: warn
