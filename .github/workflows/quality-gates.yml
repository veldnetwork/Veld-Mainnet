name: Source quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - audit-remediation
      - "release/**"
      - "hotfix/**"

permissions:
  contents: read

jobs:
  source-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python scripts/check-public-source-hygiene.py
      - run: python tests/public_source_hygiene_tests.py
      - run: python -m compileall -q scripts tests src/veld-miner-portal.py

  source-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check clang-format==21.1.7
      - run: python scripts/format-maintained-source.py --check

  pqc-provenance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: sha256sum --check PUBLICATION_SOURCE_MANIFEST.sha256
      - run: python scripts/verify-pqc-provenance.py --root .
      - run: python tests/pqc_provenance_tests.py

  release-profile-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check cryptography==46.0.7
      - run: python tests/public_release_reductions_tests.py
      - run: python tests/release_controller_oracle_tests.py
      - run: python tests/explorer_block_navigation_layout_tests.py
      - run: python tests/windows_node_keyfile_interop_tests.py
      - run: python tests/windows_snapshot_update_eligibility_tests.py
      - run: python tests/windows_wallet_portal_ui_tests.py
      - run: python tests/portal_mobile_nav_tests.py
