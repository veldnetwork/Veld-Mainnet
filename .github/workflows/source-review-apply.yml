name: Apply verified source cleanup

on:
  pull_request:
    paths:
      - '.github/workflows/source-review-apply.yml'
      - '.github/source-review-transfer/**'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'cleanup/v3.2.7-source-readability-20260924'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install isolated review dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: clang-format==18.1.8 ruff==0.11.13 tinycss2==1.5.1 webencodings==0.5.1 -r tests/requirements.txt
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/style-node" prettier@3.5.3
          sudo apt-get update
          sudo apt-get install -y libleveldb-dev libssl-dev
      - name: Reproduce and verify reviewed release tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/review-receipts"
          python - <<'PY'
          import base64, hashlib, json, lzma, os
          from pathlib import Path
          root = Path.cwd()
          encoded = ''.join((root / '.github/source-review-transfer' / f'part{i}').read_text() for i in range(1, 5))
          payload = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(payload).hexdigest() == 'd4917ecc635f7c2c97c721d790359713bf2bcd134b3f64a8cfd63d89a0df2b00'
          files = json.loads(lzma.decompress(payload))
          expected = {'.clang-format', 'scripts/source-style.py', 'scripts/source-style-web.cjs', 'tests/source_style_tests.py', 'docs/source-style.md', 'review-adjustments.patch'}
          assert set(files) == expected
          for name in sorted(expected):
              path = Path(os.environ['RUNNER_TEMP']) / name if name == 'review-adjustments.patch' else root / name
              path.write_text(files[name], encoding='utf-8', newline='')
          patch = Path(os.environ['RUNNER_TEMP']) / 'review-adjustments.patch'
          assert hashlib.sha256(patch.read_bytes()).hexdigest() == '0d1b920df680880de764ff7caa39dd814b7d8c63dbd6796d1018e2b2cfab343a'
          PY
          git add -N -f scripts/source-style.py scripts/source-style-web.cjs tests/source_style_tests.py docs/source-style.md
          python scripts/source-style.py --apply --output "$RUNNER_TEMP/style-applied" --prettier "$RUNNER_TEMP/style-node/node_modules/prettier"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add -f scripts/source-style.py scripts/source-style-web.cjs tests/source_style_tests.py docs/source-style.md
          git commit -m 'style: normalize first-party source with preservation checks'
          git apply --check --whitespace=error-all "$RUNNER_TEMP/review-adjustments.patch"
          git apply --whitespace=error-all "$RUNNER_TEMP/review-adjustments.patch"
          git add -u
          git commit -m 'test: align fixtures and cover release startup paths'
          cp .git/index "$RUNNER_TEMP/verified-index"
          GIT_INDEX_FILE="$RUNNER_TEMP/verified-index" git update-index --force-remove .github/workflows/source-review-export.yml .github/workflows/source-review-apply.yml .github/source-review-transfer/part1 .github/source-review-transfer/part2 .github/source-review-transfer/part3 .github/source-review-transfer/part4
          reviewed_tree=$(GIT_INDEX_FILE="$RUNNER_TEMP/verified-index" git write-tree)
          test "$reviewed_tree" = 4c3da5b4d62a5a37d5ba8f79ac05772f6e374bf2
          printf '%s\n' "$reviewed_tree" > "$RUNNER_TEMP/review-receipts/reproduced-release-tree.txt"
          cp "$RUNNER_TEMP/style-applied/results.json" "$RUNNER_TEMP/review-receipts/formatting-results.json"
          git archive --format=tar.gz --prefix=veld-reviewed-release/ "$reviewed_tree" > "$RUNNER_TEMP/review-receipts/reviewed-release-source.tar.gz"
      - name: Preserve newer main documentation and website changes
        shell: bash
        run: |
          set -euo pipefail
          upstream=cd61379a7bb31e4470bcf0a321e58b94f7f319ba
          if ! git merge --no-commit --no-ff "$upstream"; then
            conflicts=$(git diff --name-only --diff-filter=U)
            test "$conflicts" = website/index.html
            git show "$upstream:website/index.html" > website/index.html
            git add website/index.html
          fi
          python scripts/source-style.py --apply --output "$RUNNER_TEMP/style-main" --prettier "$RUNNER_TEMP/style-node/node_modules/prettier"
          git add -u
          git commit -m 'Merge current documentation and website maintenance'
          python scripts/source-style.py --output "$RUNNER_TEMP/style-final" --prettier "$RUNNER_TEMP/style-node/node_modules/prettier"
          cp "$RUNNER_TEMP/style-final/results.json" "$RUNNER_TEMP/review-receipts/final-style-results.json"
      - name: Exercise preservation controls and regression suites
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python tests/source_style_tests.py 2>&1 | tee "$RUNNER_TEMP/review-receipts/style-controls.log"
          python tests/run_checks.py 2>&1 | tee "$RUNNER_TEMP/review-receipts/portable.log"
          python -m unittest discover -s pool -t . -p 'test_*.py' 2>&1 | tee "$RUNNER_TEMP/review-receipts/pool.log"
          python -m unittest discover -s swap -p 'test_*.py' 2>&1 | tee "$RUNNER_TEMP/review-receipts/swap.log"
      - name: Build unsigned production Linux node
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          bash build/mainnet-v2-linux.sh node "$RUNNER_TEMP/unsigned-node" 2>&1 | tee "$RUNNER_TEMP/review-receipts/production-node-build.log"
      - name: Publish only to the existing cleanup branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/review-receipts/identity.txt"
          git ls-tree -r --full-tree HEAD > "$RUNNER_TEMP/review-receipts/git-tree.txt"
          git archive --format=tar.gz --prefix=veld-cleanup/ HEAD > "$RUNNER_TEMP/review-receipts/candidate-source.tar.gz"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" git push origin HEAD:refs/heads/cleanup/v3.2.7-source-readability-20260924
          unset auth GH_TOKEN
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: source-cleanup-validation
          path: ${{ runner.temp }}/review-receipts/
          if-no-files-found: warn
          retention-days: 1
