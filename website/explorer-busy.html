<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex">
  <title>Try again shortly | Veld Explorer</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; min-height: 100vh; display: grid; place-items: center; background: #070d09; color: #eef2ed; font: 17px/1.6 system-ui, sans-serif; }
    main { width: 100%; max-width: 480px; padding: clamp(24px, 6vw, 40px); border: 1px solid #354638; border-radius: 16px; background: #101712; }
    .brand { margin: 0 0 24px; color: #8bd347; font: 700 17px/1.5 monospace; letter-spacing: .04em; }
    h1 { margin: 0 0 16px; font-size: clamp(24px, 5vw, 30px); line-height: 1.25; }
    p { margin: 0 0 24px; color: #b6c0b7; }
    a { display: inline-block; min-height: 48px; padding: 10px 22px; border: 1px solid #58625a; border-radius: 10px; background: #303b33; color: #eef2ed; text-decoration: none; font-weight: 600; }
    a:focus-visible { outline: 3px solid #8bd347; outline-offset: 4px; }
    @media (prefers-color-scheme: light) {
      body { background: #f6f7f5; color: #18211a; }
      main { background: #fff; border-color: #b9c2ba; }
      .brand { color: #267640; }
      p { color: #526055; }
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">VELD EXPLORER</p>
    <h1>Try again shortly</h1>
    <p>Explorer is temporarily busy. Please wait a minute, then try again.</p>
    <a href="">Try again</a>
  </main>
</body>
</html>
