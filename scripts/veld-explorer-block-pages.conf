    location ^~ /api/v1/blocks/ {
        limit_req zone=wallet_rpc burst=20 nodelay;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8096;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Host explorer.veld.network;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 8s;
        proxy_buffering on;
        proxy_max_temp_file_size 0;
        include /etc/nginx/snippets/veld-proxy-security-hide.conf;
        include /etc/nginx/snippets/veld-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

