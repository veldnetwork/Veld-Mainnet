# Include this file inside the authenticated TLS wallet `server {}` block.
# The desktop's fixed /wrapd-api path reaches only veld-wrapd's loopback
# listener.  Do not expose port 8097 or replace these exact locations with a
# catch-all proxy.
#
# AUTHENTICATION IS MANDATORY.  The operator-installed include must fail
# `nginx -t` when absent and must reject an unauthenticated wallet request.

location = /wrapd-api/wrap {
    include /etc/nginx/snippets/veld-wallet-auth-required.conf;

    if ($request_method != POST) { return 405; }
    if ($http_content_type !~* "^application/json(?:[[:space:]]*;|$)") { return 415; }

    client_max_body_size 4k;
    client_body_buffer_size 4k;
    client_body_timeout 5s;
    proxy_request_buffering on;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host 127.0.0.1:8097;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
    proxy_set_header Access-Control-Request-Method "";
    proxy_set_header Access-Control-Request-Headers "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 20s;
    send_timeout 20s;
    proxy_redirect off;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_buffering off;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Cache-Control;
    proxy_hide_header Pragma;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    proxy_pass http://127.0.0.1:8097/wrap;
}

# Static admission metadata and authenticated backend health.  Query strings
# are rejected by veld-wrapd for both exact paths.
location ~ "^/wrapd-api/(?:admission|health)$" {
    include /etc/nginx/snippets/veld-wallet-auth-required.conf;

    if ($request_method != GET) { return 405; }
    client_max_body_size 1k;
    client_body_timeout 5s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host 127.0.0.1:8097;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 20s;
    send_timeout 20s;
    proxy_redirect off;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_buffering off;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    rewrite ^/wrapd-api(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:8097;
}

# Read-only Bitcoin destination decoder for the redeem UI.  veld-wrapd itself
# requires exactly one bounded `address` query field and delegates decoding to
# the same Bitcoin Core instance that constructs payouts.
location = /wrapd-api/spk {
    include /etc/nginx/snippets/veld-wallet-auth-required.conf;

    if ($request_method != GET) { return 405; }
    client_max_body_size 1k;
    client_body_timeout 5s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host 127.0.0.1:8097;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 20s;
    send_timeout 20s;
    proxy_redirect off;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_buffering off;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    proxy_pass http://127.0.0.1:8097/spk;
}

location /wrapd-api {
    return 404;
}
